<!doctype html>
<html lang="en">
<head>
    <!-- meta -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- SEO -->
    <meta name="description" content="Reseñas de video juegos y peliculas, Pixel y Frame">
    <title>Pixel & Frame</title>
    <!-- href -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="assets/fonts/fonts.css">

    <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />

    <script src="/js/app.js" defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body>

<!-- =========== -->
<!-- header esto es una modificacion para testear-->

<header>
    <!-- Navbar principal -->
    <div class="container">
        <div class="row">
            <div class="col-12">
                <nav class="navbar navbar-expand-lg fixed-top">
                    <div class="container-fluid">
                        <!-- Logo -->
                        <a class="navbar-brand" href="/index.html">
                            <img class="logo-web" src="assets/img/pyf-logo.png" alt="Logo de página" height="40">
                        </a>

                        <!-- Botón hamburguesa para móviles -->
                        <button class="navbar-toggler border-black" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
                                aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>

                        <!-- Icono de login (visible siempre, fuera del collapse) -->
                        <a href="javascript:void(0)" class="nav-link d-lg-none" data-bs-toggle="modal" data-bs-target="#loginModal">
                            <img class="logo-login" src="https://cdn-icons-png.flaticon.com/128/16/16612.png" alt="Logo para iniciar sesión">
                        </a>

                        <!-- Contenido del navbar -->
                        <div class="collapse navbar-collapse" id="navbarSupportedContent">
                            <!-- Enlaces de navegación -->
                            <ul class="navbar-nav me-auto">
                                <li class="nav-item">
                                    <a class="nav-link text-black mx-2" href="/paginas/videojuegos/videojuegos-index.html">Videojuegos</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link text-black mx-2" href="/paginas/peliculas/peliculas-index.html">Películas</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link text-black mx-2" href="/paginas/series/series-index.html">Series</a>
                                </li>
                            </ul>

                            <!-- Icono de login para pantallas grandes -->
                            <div class="d-none d-lg-flex">
                                <a href="javascript:void(0)" id="cuentaImg" class="nav-link" data-bs-toggle="modal" data-bs-target="#loginModal">
                                    <img class="logo-login" src="https://cdn-icons-png.flaticon.com/128/16/16612.png" alt="Logo para iniciar sesión">
                                </a>
                            </div>
                        </div>
                    </div>
                </nav>
            </div>
        </div>
    </div>
</header>
<!-- header -->
<!-- =========== -->
<!-- main -->

<main>

    <div class="row">
        <div class="col-1-sm" id="post-col" >
            <div class="container my-4" id="videojuegos"></div>
        </div>
    </div>  
</main>

<!-- main -->
<!-- =========== -->
<!-- footer -->

<footer class="bg-dark text-white text-center py-3 mt-auto">
    <div class="container">
        <p class="mb-1">&copy; 2025 PixelFrame. Todos los derechos reservados.</p>
        <p class="mb-1">PixelFram Team Developer</p>
        <small>
            <a href="javascript:void(0)" class="text-white text-decoration-none me-3">Política de privacidad</a>
            <a href="javascript:void(0)" class="text-white text-decoration-none">Términos de uso</a>
        </small>
    </div>
</footer>
<!-- footer -->

<!-- login emergent -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4 rounded-4 shadow-lg">
            <button type="button" class="btn-close position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Cerrar"></button>

            <h2 class="text-center mb-3" id="formTitle">Iniciar Sesión</h2>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" required />
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="password" required />
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>

            <form id="registerForm" class="d-none">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre</label>
                    <input type="text" class="form-control" id="nombre" required />
                </div>
                <div class="mb-3">
                    <label for="emailRegister" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="emailRegister" required />
                </div>
                <div class="mb-3">
                    <label for="passwordRegister" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="passwordRegister" required />
                </div>
                <button type="submit" class="btn btn-success w-100">Registrarse</button>
            </form>

            <hr />
            <div class="text-center" id="switchText">
                <p>¿No tienes cuenta? <a href="#" onclick="mostrarRegistro()">Regístrate</a></p>
            </div>
        </div>
    </div>
</div>

<!-- js scripts -->
<script src="/bootstrap/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
