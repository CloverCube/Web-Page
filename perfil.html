<!doctype html>
<html lang="en">
<head>
    <base href="/Web-Page/">
    <!-- meta -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- SEO -->
    <meta name="description" content="Reseñas de video juegos y peliculas, Pixel y Frame">
    <title>Pixel & Frame</title>
    <!-- href -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/assets/fonts/fonts.css">

    <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body>

<!-- =========== -->
<!-- header esto es una modificacion para testear-->

<header>
    <div class="game-header text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">PIXEL & FRAME</h1>
            <p class="lead">La revolución indie que está cambiando la narrativa en videojuegos</p>
            <div class="mt-4">
                <span class="badge bg-primary me-2">Indie</span>
                <span class="badge bg-primary me-2">Narrativa</span>
                <span class="badge bg-primary">Innovación</span>
            </div>
        </div>
    </div>
</header>

<div class="sticky-top">
    <div id="navbar-placeholder" class="d-flex justify-content-center"></div>
</div>

<main>

<div class="container mt-5">
        <!-- Fila principal del perfil -->
        <div class="row">
            <!-- Columna para la imagen -->
            <div class="col-3">
                <img src="https://img.freepik.com/foto-gratis/feliz-mujer-atractiva-bailando-divirtiendose-levantando-manos-preocupaciones-disfrutando-musica-pie-contra-pared-blanca_176420-38816.jpg?semt=ais_items_boosted&w=740" alt="Foto de perfil" class="imagen-perfil">
            </div>
            
            <!-- Columna para la información del usuario -->
            <div class="col-9">
                <div class="d-flex flex-column justify-content-center h-100">
                    <div class="mb-2">
                        <span class="h4 fw-bold">Juan Pérez</span>
                    </div>
                    <div class="mb-2">
                        <span class="text-muted">@juanperez_dev</span>
                    </div>
                    <div>
                        <span class="text-secondary">Fecha de creación: 15 de marzo, 2023</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sección de posts -->
        <section class="my-5" id="perfil-contenido">
            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="container-fluid">
                        
                        <!-- Comentario individual con borde y margin -->
                        <div class="border rounded p-3 m-3">
                            <div class="mb-3">
                                <h5 class="card-title">
                                    <a href="#" class="text-decoration-none">The Last of Us Part II</a>
                                </h5>
                            </div>
                            <div>
                                <span class="text-muted">Nada mal ese juego a mi si me gusto mucho</span>
                            </div>
                        </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>

</main>

<!-- main -->
<!-- =========== -->
<!-- footer -->

<div id="footer-placeholder"></div>

<!-- js scripts -->
<script src="/bootstrap/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/js/app.js" defer></script>
</body>
</html>
