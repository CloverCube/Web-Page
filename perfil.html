<!doctype html>
<html lang="en">
<head>
    <base href="/Web-Page/">
    <!-- meta -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- SEO -->
    <meta name="description" content="Reseñas de video juegos y peliculas, Pixel y Frame">
    <title>Pixel & Frame</title>
    <!-- href -->
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/assets/fonts/fonts.css">

    <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body>

<!-- =========== -->
<!-- header esto es una modificacion para testear-->

<header>
    <div class="game-header text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">
                <span class="text-orange">PIXEL</span>
                <span class="text-blue">&</span>
                <span class="text-orange">F</span><span class="text-blue">RAME</span>
            </h1>
            <h2 class="lead">Perfil</h2>
        </div>
    </div>
</header>

<div class="sticky-top">
    <div id="navbar-placeholder" class="d-flex justify-content-center"></div>
</div>

<main>
    <div class="container mt-5">
        <!-- Fila principal del perfil -->
        <div class="row align-items-center">
            <!-- Imagen de perfil -->
            <div class="col-12 col-md-3 text-center mb-3 mb-md-0">
                <i class="bi bi-person-circle" style="font-size: 10rem;"></i>
            </div>

            <!-- Información del usuario -->
            <div class="col-12 col-md-9">
                <div class="d-flex flex-column justify-content-center h-100">
                    <div class="mb-2">
                        <span id="perfil-nombre" class="h4 fw-bold">Juan Pérez</span>
                    </div>
                    <div class="mb-2">
                        <span id="perfil-fecha-creacion" class="text-secondary">Fecha de creación: 15 de marzo, 2023</span>
                    </div>
                    <div class="mb-2">
                        <span id="perfil-correo" class="text-secondary">Correo: juan@example.com</span>
                    </div>
                    <div class="mb-2">
                        <span id="perfil-stats" class="text-secondary">12 reseñas • 8 favoritos • 53 visitas</span>
                    </div>
                </div>
            </div>
        </div>

        <section class="my-5" id="perfil-contenido">
            <h5>Reseñas</h5>
            <div id="perfil-resenas" class="mb-4"></div>

            <h5>Favoritos</h5>
            <div id="perfil-favoritos" class="mb-4"></div>

            <h5>Historial</h5>
            <div id="perfil-historial" class="mb-4"></div>
        </section>
    </div>

</main>

<!-- main -->
<!-- =========== -->
<!-- footer -->

<div id="footer-placeholder"></div>

<!-- js scripts -->
<script src="/bootstrap/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/js/app.js" defer></script>
<script src="/js/perfil.js" defer></script>
</body>
</html>
