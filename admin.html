<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/assets/fonts/fonts.css">

    <link href="/bootstrap/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@100..900&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
</head>
<body>
<header>
    <div class="game-header text-center">
        <div class="container">
            <h1 class="display-4 fw-bold">
                <span class="text-orange">ADMIN</span>
                <span class="text-blue">PANEL</span>
            </h1>
        </div>
    </div>
</header>

<div class="sticky-top">
    <div id="navbar-placeholder" class="d-flex justify-content-center"></div>
</div>

<div class="container">
    <h1 class="text-dark mt-5">Admin Panel</h1>

    <div class="mt-4">
        <button class="btn btn-dark mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#adminContentCollapse" aria-expanded="false" aria-controls="adminContentCollapse">
            Gestión de Contenidos
        </button>

        <div class="collapse" id="adminContentCollapse">
            <div class="card card-body">
                <h2 class="mb-3">Gestión de Contenidos</h2>
                <button id="btnAgregar" class="btn btn-success btn-sm">Agregar</button>

                <div class="row" id="formularios-estilos" style="display: none; margin-top: 20px;">
                    <div class="form-container col-12">
                        <h2>Registrar Articulo</h2>

                        <form id="contenidosForm">
                            <div class="row">
                                <div class="col-12 col-md-6">
                                    <div class="mb-3">
                                        <label for="titulo" class="form-label">Título</label>
                                        <input type="text" class="form-control" id="titulo" name="titulo" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="descripcion" class="form-label">Descripción</label>
                                        <textarea class="form-control" id="descripcion" name="descripcion" required></textarea>
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <div class="mb-3">
                                        <label for="tipoID" class="form-label">Tipo de Contenido</label>
                                        <select class="form-select" id="tipoID" name="tipoID" required>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="generoID" class="form-label">Género</label>
                                        <select class="form-select" id="generoID" name="generoID" required>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="fechaLanzamiento" class="form-label">Fecha de Lanzamiento</label>
                                        <input type="date" class="form-control" id="fechaLanzamiento" name="fechaLanzamiento" required>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="imagenURL">Imagen Destacada (URL)</label><br>
                                <input type="url" id="imagenURL" name="imagenURL" placeholder="https://ejemplo.com/imagen.jpg" class="form-control">
                            </div>

                            <hr>

                            <h2 class="mt-4">Completar artículo</h2>
                            <div class="row">
                                <div class="col-12 col-md-6">
                                    <div class="mb-3">
                                        <label for="PuntoUno">Punto Uno (SubTitulo)</label>
                                        <input type="text" id="PuntoUno" name="PuntoUno" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="ContenidoPuntoUno">Contenido</label>
                                        <textarea id="ContenidoPuntoUno" name="ContenidoPuntoUno" class="form-control" required></textarea>
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <div class="mb-3">
                                        <label for="PuntoDos">Punto Dos (SubTitulo)</label>
                                        <input type="text" id="PuntoDos" name="PuntoDos" class="form-control" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="ContenidoPuntoDos">Contenido</label>
                                        <textarea id="ContenidoPuntoDos" name="ContenidoPuntoDos" class="form-control" required></textarea>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="PuntoTres">Punto Tres (SubTitulo)</label>
                                <input type="text" id="PuntoTres" name="PuntoTres" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label for="ContenidoPuntoTres">Contenido</label>
                                <textarea id="ContenidoPuntoTres" name="ContenidoPuntoTres" class="form-control" required></textarea>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary">Guardar Contenido</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="Content-Admin" class="row g-3" style="max-height: 500px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editarModal" tabindex="-1" aria-labelledby="editarModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="formEditarContenido">
                    <div class="modal-header">
                        <h5 class="modal-title" id="editarModalLabel">Editar Contenido</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="editContenidoID">

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="editTitulo" class="form-label">Título</label>
                                    <input type="text" class="form-control" id="editTitulo" required>
                                </div>

                                <div class="mb-3">
                                    <label for="editDescripcion" class="form-label">Descripción</label>
                                    <textarea class="form-control" id="editDescripcion" rows="3" required></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="editTipoID" class="form-label">Tipo</label>
                                    <select class="form-select" id="editTipoID" name="editTipoID" required>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="editGeneroID" class="form-label">Género</label>
                                    <select class="form-select" id="editGeneroID" name="editGeneroID" required>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label for="editFechaLanzamiento" class="form-label">Fecha de Lanzamiento</label>
                                    <input type="date" class="form-control" id="editFechaLanzamiento" required>
                                </div>

                                <div class="mb-3">
                                    <label for="editImagen" class="form-label">Imagen Destacada (URL)</label>
                                    <input type="url" class="form-control" id="editImagen" placeholder="https://ejemplo.com/imagen.jpg">
                                </div>
                            </div>

                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="editTituloSecond" class="form-label">Título Sección 1</label>
                                    <input type="text" class="form-control" id="editTituloSecond">
                                </div>

                                <div class="mb-3">
                                    <label for="editContentSecond" class="form-label">Contenido Sección 1</label>
                                    <textarea class="form-control" id="editContentSecond" rows="3"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="editTituloThree" class="form-label">Título Sección 2</label>
                                    <input type="text" class="form-control" id="editTituloThree">
                                </div>

                                <div class="mb-3">
                                    <label for="editContentThree" class="form-label">Contenido Sección 2</label>
                                    <textarea class="form-control" id="editContentThree" rows="3"></textarea>
                                </div>

                                <div class="mb-3">
                                    <label for="editTituloFour" class="form-label">Título Sección 3</label>
                                    <input type="text" class="form-control" id="editTituloFour">
                                </div>

                                <div class="mb-3">
                                    <label for="editContentFour" class="form-label">Contenido Sección 3</label>
                                    <textarea class="form-control" id="editContentFour" rows="3"></textarea>
                                </div>
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-primary">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div id="footer-placeholder"></div>

<script src="/bootstrap/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="/js/app.js"></script>
<script src="/js/admin.js"></script>
</body>
</html>
